<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101519"><title>The Soundtrack</title>
<style>
:root{color-scheme:dark;--bg:#101519;--panel:#1b2429;--ink:#eff3ef;--muted:#9faeac;--accent:#c2d9a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#263c39,transparent 65%),var(--bg);color:var(--ink);font:16px system-ui,sans-serif;min-height:100vh}main{max-width:980px;margin:auto;padding:64px 24px}header small{letter-spacing:.22em;color:var(--accent)}h1{font:clamp(38px,7vw,68px) Georgia,serif;margin:14px 0}p{color:var(--muted);line-height:1.6}.layout{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;margin-top:36px}.card{background:#1b2429dc;border:1px solid #ffffff13;border-radius:22px;padding:26px}.art{aspect-ratio:1;max-height:260px;margin:auto;display:grid;place-items:center;border-radius:15px;background:radial-gradient(circle,#6b806a 0,#253d39 38%,#131d22 70%);overflow:hidden}.disc{width:72%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#151f22 0 3px,#293437 4px 5px);display:grid;place-items:center;box-shadow:0 10px 35px #0007}.disc span{width:30%;aspect-ratio:1;display:grid;place-items:center;background:var(--accent);border-radius:50%;color:#24322c;font-size:28px}h2{font:27px Georgia,serif;margin-bottom:6px}.meta{min-height:26px;color:var(--muted)}button{font:inherit;cursor:pointer;color:inherit;background:#ffffff09;border:1px solid #ffffff18;border-radius:12px;padding:10px}button:hover{background:#ffffff16}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{opacity:.4;cursor:default}.transport{display:flex;justify-content:center;gap:12px;align-items:center;margin:22px 0}.play{background:var(--accent);color:#15221b;border:0;min-width:76px;font-size:22px}.on{color:var(--accent);border-color:var(--accent)}input[type=range]{accent-color:var(--accent);width:100%}.times{display:flex;justify-content:space-between;font:12px system-ui;color:var(--muted)}.volume{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}.track{display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff0c;padding:9px 0}.song{display:flex;gap:15px;align-items:center;text-align:left;flex:1;min-width:0;background:none;border:0;padding:12px 8px}.song span:last-child{min-width:0}.song strong{display:block;overflow-wrap:anywhere;font-weight:500}.song small{display:block;color:var(--muted);margin-top:4px}.number{color:var(--muted);font-size:12px}.selected{background:#c2d9a20d;border-radius:12px}.selected .number{color:var(--accent)}.list-head{display:flex;justify-content:space-between;align-items:center}.list-head h2{font-size:23px;margin-top:0}#count{color:var(--muted);font-size:12px}#status{font-size:13px;min-height:22px}a{color:var(--accent)}footer{font-size:12px;color:var(--muted);margin-top:25px}@media(max-width:680px){main{padding:32px 18px}.layout{grid-template-columns:1fr}.art{max-width:240px}.card{padding:20px}}
</style></head><body><main><header><small>AN ORIGINAL COLLECTION</small><h1>The Soundtrack</h1><p>Press play and stay awhile.</p></header><div class="layout"><section class="card" aria-label="Music player"><div class="art" aria-hidden="true"><div class="disc"><span>♫</span></div></div><h2 id="title">Finding the music…</h2><div id="meta" class="meta">Choose a track to begin</div><div class="transport"><button id="shuffle" aria-label="Shuffle" aria-pressed="false" title="Shuffle">⤨</button><button id="previous" aria-label="Previous track" title="Previous track">◀|</button><button id="play" class="play" aria-label="Play">▶</button><button id="next" aria-label="Next track" title="Next track">|▶</button><button id="repeat" aria-label="Repeat: off" title="Repeat: off">↻</button></div><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Playback position" disabled><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><p id="status" role="status" aria-live="polite"></p><label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label></section><section class="card"><div class="list-head"><h2>Track listing</h2><span id="count"></span></div><div id="tracks"></div></section></div><footer>Original soundtrack · Listen and enjoy</footer></main><audio id="audio" preload="metadata" controlslist="nodownload" oncontextmenu="return false"></audio>
<script>
'use strict';
/* OPTIONAL CONFIGURATION
   Default: detects owner/repository on username.github.io/repository/.
   Set owner/repo on custom domains. Set branch if Pages uses a non-default branch.
   Audio files and this index.html should be in the repository root.
   For an API-independent playlist, fill tracks with your eight files:
   tracks: [{file:'01 - Song.mp3',title:'Song title',artist:'Artist',info:'About this song'}]
   Manual tracks also let you set song information and your preferred order.
   No GitHub tokens or secrets belong in this file.
*/
const CONFIG={owner:'',repo:'',branch:'',tracks:[]};
const $=id=>document.getElementById(id),audio=$('audio');
const parts=location.pathname.split('/').filter(Boolean);
const owner=CONFIG.owner||(location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'');
const repo=CONFIG.repo||(owner?(parts.length&&parts[0]!=='index.html'?decodeURIComponent(parts[0]):owner+'.github.io'):'');
let tracks=[],current=-1,order=[],position=0,shuffled=false,repeat=0,request=0;
const time=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function mix(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rebuild(){const rest=tracks.map((_,i)=>i).filter(i=>i!==current);order=shuffled?[current,...mix(rest)]:tracks.map((_,i)=>i);position=order.indexOf(current)}
function render(){ $('tracks').replaceChildren();tracks.forEach((t,i)=>{const row=document.createElement('div');row.className='track'+(i===current?' selected':'');const song=document.createElement('button');song.className='song';song.setAttribute('aria-label','Play '+t.title);if(i===current)song.setAttribute('aria-current','true');const num=document.createElement('span');num.className='number';num.textContent=String(i+1).padStart(2,'0');const names=document.createElement('span'),title=document.createElement('strong'),sub=document.createElement('small');title.textContent=t.title;sub.textContent=t.artist||t.file;names.append(title,sub);song.append(num,names);song.onclick=()=>{select(i);rebuild();play()};row.append(song);$('tracks').append(row)})}
function select(i){request++;current=i;audio.src=new URL(encodeURIComponent(tracks[i].file),new URL('./',location.href)).href;audio.load();$('title').textContent=tracks[i].title;$('meta').textContent=[tracks[i].artist,tracks[i].info].filter(Boolean).join(' · ')||tracks[i].file;$('status').textContent='';$('seek').value=0;$('seek').disabled=true;$('elapsed').textContent='0:00';$('duration').textContent='0:00';render()}
async function play(){const token=++request;try{await audio.play();if(token===request)$('status').textContent=''}catch(e){if(token===request&&e.name!=='AbortError')$('status').textContent='Playback could not start. Press play again, or try another track. Check that the audio file is published and supported by this browser.'}}
function advance(delta,automatic=false){if(!tracks.length)return;if(automatic&&repeat===2){audio.currentTime=0;play();return}let p=position+delta;if(p>=order.length||p<0){if(automatic&&repeat===0){$('status').textContent='End of playlist.';return}p=(p+order.length)%order.length;if(automatic&&shuffled&&order.length>1){const last=current;order=mix(order);if(order[0]===last)[order[0],order[1]]=[order[1],order[0]]}}position=p;select(order[position]);play()}
$('play').onclick=()=>{if(current<0)return;audio.paused?play():audio.pause()};$('previous').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);
$('shuffle').onclick=()=>{shuffled=!shuffled;$('shuffle').classList.toggle('on',shuffled);$('shuffle').setAttribute('aria-pressed',String(shuffled));rebuild()};
$('repeat').onclick=()=>{repeat=(repeat+1)%3;const label=['off','playlist','one track'][repeat];$('repeat').classList.toggle('on',!!repeat);$('repeat').textContent=repeat===2?'↻ 1':'↻';$('repeat').title='Repeat: '+label;$('repeat').setAttribute('aria-label','Repeat: '+label);$('status').textContent='Repeat: '+label};
audio.onplay=()=>{$('play').textContent='Ⅱ';$('play').setAttribute('aria-label','Pause')};audio.onpause=()=>{$('play').textContent='▶';$('play').setAttribute('aria-label','Play')};audio.onended=()=>advance(1,true);audio.onerror=()=>{$('status').textContent='This track could not be loaded. Check the filename and audio format, or choose another track.'};audio.onloadedmetadata=()=>{$('duration').textContent=time(audio.duration);$('seek').disabled=!Number.isFinite(audio.duration)};audio.ontimeupdate=()=>{$('elapsed').textContent=time(audio.currentTime);$('seek').value=Number.isFinite(audio.duration)&&audio.duration?audio.currentTime/audio.duration*100:0};$('seek').oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number($('seek').value)/100*audio.duration};$('volume').oninput=()=>audio.volume=Number($('volume').value);
async function init(){try{if(CONFIG.tracks.length){tracks=CONFIG.tracks.map(t=>({...t,title:t.title||t.file.replace(/\.[^.]+$/,'')}))}else{if(!owner||!repo)throw Error('Open this page on GitHub Pages, or set owner and repo in CONFIG. For local use, fill CONFIG.tracks.');const url='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/contents/'+(CONFIG.branch?'?ref='+encodeURIComponent(CONFIG.branch):'');const response=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('Could not list the repository (HTTP '+response.status+'). Check owner/repo and branch, or fill CONFIG.tracks to avoid API limits.');const files=await response.json();if(!Array.isArray(files))throw Error('Repository listing was not a folder.');tracks=files.filter(f=>f.type==='file'&&/\.(mp3|m4a|aac|ogg|oga|wav|flac|opus|webm)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map(f=>({file:f.name,title:f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ')}))}if(!tracks.length)throw Error('No audio files found in the repository root. Add your songs and reload.');$('count').textContent=tracks.length+' tracks';document.querySelector('header p').textContent=tracks.length+' pieces. One world. Press play and stay awhile.';select(0);rebuild()}catch(e){$('title').textContent='The music is on its way';$('status').textContent=e.message}finally{for(const id of ['play','previous','next','shuffle','repeat'])$(id).disabled=!tracks.length}}
init();
</script></body></html>
