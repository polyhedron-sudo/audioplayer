<style>
:root{color-scheme:dark;--bg:#101519;--panel:#1b2429;--ink:#eff3ef;--muted:#9faeac;--accent:#c2d9a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#263c39,transparent 65%),var(--bg);color:var(--ink);font:16px system-ui,sans-serif;min-height:100vh}main{max-width:980px;margin:auto;padding:64px 24px}header small{letter-spacing:.22em;color:var(--accent)}h1{font:clamp(38px,7vw,68px) Georgia,serif;margin:14px 0}p{color:var(--muted);line-height:1.6}.layout{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;margin-top:36px}.card{background:#1b2429dc;border:1px solid #ffffff13;border-radius:22px;padding:26px}.art{width:100%;max-width:260px;aspect-ratio:1;max-height:260px;margin:auto;display:grid;place-items:center;border-radius:15px;background:radial-gradient(circle,#6b806a 0,#253d39 38%,#131d22 70%);overflow:hidden}.disc{width:72%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#151f22 0 3px,#293437 4px 5px);display:grid;place-items:center;box-shadow:0 10px 35px #0007}.disc span{width:30%;aspect-ratio:1;display:grid;place-items:center;background:var(--accent);border-radius:50%;color:#24322c;font-size:28px}h2{font:27px Georgia,serif;margin-bottom:6px}.meta{min-height:26px;color:var(--muted)}button{font:inherit;cursor:pointer;color:inherit;background:#ffffff09;border:1px solid #ffffff18;border-radius:12px;padding:10px}button:hover{background:#ffffff16}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{opacity:.4;cursor:default}.transport{display:flex;justify-content:center;gap:12px;align-items:center;margin:22px 0}.play{background:var(--accent);color:#15221b;border:0;min-width:76px;font-size:22px}.on{color:var(--accent);border-color:var(--accent)}input[type=range]{accent-color:var(--accent);width:100%}.times{display:flex;justify-content:space-between;font:12px system-ui;color:var(--muted)}.volume{display:flex;align-items:center;gap:12px;font-size:13p </style></head><body><main><header><small>AN ORIGINAL LYRICAL COLLECTION</small><h1>BAF Soundtrack</h1><p>Click Shuffle, Repeat, Play and stay awhile.</p></header><div class="layout"><section class="card" aria-label="Music player"><div class="art"><img id="cover" alt="" hidden></div><h2 id="title">Finding the music…</h2><div id="meta" class="meta">Choose a track to begin</div><div id="transport" class="transport"><button id="shuffle" aria-label="Shuffle" aria-pressed="false" title="Shuffle">⤨</button><button id="previous" aria-label="Previous track" title="Previous track">◀|</button><button id="play" class="play" aria-label="Play">▶</button><button id="next" aria-label="Next track" title="Next track">|▶</button><button id="repeat" aria-label="Repeat: off" title="Repeat: off">↻</button></div><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Playback position" disabled><div id="play-times" class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><p id="status" role="status" aria-live="polite"></p><div class="visualizer" aria-hidden="true"><canvas id="visualizer"></canvas></div><button id="lyrics-toggle" class="lyrics-toggle" aria-expanded="false" aria-controls="lyrics-panel" hidden>♫ Lyrics</button><section id="lyrics-panel" class="lyrics-panel" aria-label="Song lyrics" hidden><pre id="lyrics-text"></pre></section><label id="volume-group" class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label></section><section class="card"><div id="desktop-controls" aria-label="Playback controls"></div><div class="list-head"><h2>Track listing</h2><span id="count"></span></div><div id="tracks"></div></section></div><footer>Original soundtrack · Listen and enjoy</footer></main><audio id="audio" preload="metadata" controlslist="nodownload" oncontextmenu="return false"></audio>
<script>
'use strict';
// Keep index.html in the root and songs/artwork in used-songs/.
// Manual tracks may include file, title, artist, info, and artwork filenames.
// No tokens or secrets belong in this configuration.
const CONFIG={owner:'',repo:'',branch:'',tracks:[]};
const $=id=>document.getElementById(id),audio=$('audio');
const parts=location.pathname.split('/').filter(Boolean);
const owner=CONFIG.owner||(location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'');
const repo=CONFIG.repo||(owner?(parts.length&&parts[0]!=='index.html'?decodeURIComponent(parts[0]):owner+'.github.io'):'');
const songURL=file=>new URL(encodeURIComponent(file),new URL('./used-songs/',location.href)).href;
let tracks=[],current=-1,order=[],position=0,shuffled=false,repeat=0,request=0;
let lyricsController=null,lyricsRequest=0;
// The canvas is decorative: audio continues normally if visualization is unavailable.
const visualCanvas=$('visualizer'),visualCtx=visualCanvas.getContext('2d');
let audioContext=null,analyser=null,volumeGain=null,frequencyData=null,visualFrame=0,visualActive=false;
// Three scrolling frequency histories share the existing analyser on desktop and mobile.
const waveHistory=[[],[],[]];
let lastWaveSample=0;
const reducedMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function setupVisualizer(){
  if(audioContext||!visualCtx)return;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  try{
    audioContext=new AudioContextClass();
    analyser=audioContext.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.84;
    frequencyData=new Uint8Array(analyser.frequencyBinCount);
    const source=audioContext.createMediaElementSource(audio);
    volumeGain=audioContext.createGain();
    volumeGain.gain.value=Number($('volume').value);
    source.connect(analyser);analyser.connect(volumeGain);volumeGain.connect(audioContext.destination);
  }catch(_){analyser=null;frequencyData=null;volumeGain=null}
}
function resizeVisualizer(){
  if(!visualCtx)return;
  const rect=visualCanvas.getBoundingClientRect(),scale=Math.min(window.devicePixelRatio||1,2);
  const width=Math.round(rect.width*scale),height=Math.round(rect.height*scale);
  if(width&&height&&(visualCanvas.width!==width||visualCanvas.height!==height)){
    visualCanvas.width=width;visualCanvas.height=height;
  }
}
function paintLayeredVisualizer(w,h,playing,desktop){
  const count=desktop?96:64,now=performance.now(),stepMs=desktop?33:45;
  // Cap history when the viewport changes between desktop and mobile.
  waveHistory.forEach(values=>{while(values.length>count)values.shift()});
  if(playing&&(!lastWaveSample||now-lastWaveSample>=stepMs)){
    // Convert real frequency ranges to FFT bins using the actual sample rate.
    const hzPerBin=audioContext.sampleRate/analyser.fftSize;
    const ranges=[[45,250],[250,2500],[2500,8000]];
    ranges.forEach(([lowHz,highHz],lane)=>{
      const a=Math.max(1,Math.floor(lowHz/hzPerBin));
      const b=Math.min(frequencyData.length,Math.ceil(highHz/hzPerBin));
      let sumSquares=0,peak=0;
      for(let i=a;i<b;i++){
        const v=frequencyData[i]/255;
        sumSquares+=v*v;
        if(v>peak)peak=v;
      }
      // RMS supplies musical body; the peak preserves short accents that averaging hid.
      const rms=Math.sqrt(sumSquares/Math.max(1,b-a));
      const energy=.6*rms+.4*peak;
      const value=Math.min(1,Math.pow(energy,.85)*(lane===2?1.3:1.15));
      waveHistory[lane].push(value);
      if(waveHistory[lane].length>count)waveHistory[lane].shift();
    });
    lastWaveSample=now;
  }
  const lanes=[
    {y:.26,amp:.185,color:'rgba(197,215,156,.83)',glow:'#bdd69f',width:2.9},
    {y:.56,amp:.185,color:'rgba(111,193,159,.86)',glow:'#80c9ad',width:2.3},
    {y:.86,amp:.155,color:'rgba(141,191,202,.8)',glow:'#8ecbd0',width:1.65}
  ];
  lanes.forEach((style,lane)=>{
    const base=h*style.y,values=waveHistory[lane];
    visualCtx.beginPath();
    visualCtx.strokeStyle='rgba(194,217,162,.09)';
    visualCtx.lineWidth=1;
    visualCtx.moveTo(0,base);visualCtx.lineTo(w,base);visualCtx.stroke();
    if(!values.length)return;
    visualCtx.save();
    visualCtx.strokeStyle=style.color;
    visualCtx.lineWidth=style.width*(desktop?1:.78)*Math.min(window.devicePixelRatio||1,2);
    visualCtx.lineJoin='round';visualCtx.lineCap='round';
    visualCtx.shadowColor=style.glow;visualCtx.shadowBlur=playing?(desktop?11:6):3;
    visualCtx.beginPath();
    // Newest audio appears on the right; the trace moves left as music progresses.
    const offset=count-values.length,dx=w/(count-1);
    values.forEach((v,i)=>{
      const x=(offset+i)*dx,y=base-v*h*style.amp*(desktop?1:.85);
      if(i===0)visualCtx.moveTo(x,y);else visualCtx.lineTo(x,y);
    });
    visualCtx.stroke();visualCtx.restore();
  });
}
function paintVisualizer(){
  if(!visualCtx)return;
  resizeVisualizer();
  const w=visualCanvas.width,h=visualCanvas.height;
  if(!w||!h)return;
  visualCtx.clearRect(0,0,w,h);
  const playing=visualActive&&!audio.paused&&!audio.ended&&analyser&&!reducedMotion;
  const desktop=window.matchMedia('(min-width:681px)').matches;
  if(analyser)analyser.smoothingTimeConstant=.42;
  if(playing)analyser.getByteFrequencyData(frequencyData);
  paintLayeredVisualizer(w,h,playing,desktop);
  if(playing)visualFrame=requestAnimationFrame(paintVisualizer);
}
function stopVisualizer(){
  visualActive=false;cancelAnimationFrame(visualFrame);paintVisualizer();
}
function startVisualizer(){
  if(!visualCtx)return;
  visualActive=true;cancelAnimationFrame(visualFrame);paintVisualizer();
}
window.addEventListener('resize',()=>{if(!visualActive||reducedMotion)paintVisualizer()});

function closeLyrics(){
  ++lyricsRequest;if(lyricsController)lyricsController.abort();lyricsController=null;
  $('lyrics-toggle').hidden=true;$('lyrics-toggle').setAttribute('aria-expanded','false');
  $('lyrics-panel').hidden=true;$('lyrics-text').textContent='';
}
$('lyrics-toggle').onclick=async()=>{
  const panel=$('lyrics-panel'),button=$('lyrics-toggle');
  if(!panel.hidden){panel.hidden=true;button.setAttribute('aria-expanded','false');return}
  panel.hidden=false;button.setAttribute('aria-expanded','true');
  const track=tracks[current];if(!track||!track.lyrics)return;
  if(track.lyricsText!==undefined){$('lyrics-text').textContent=track.lyricsText;return}
  const token=++lyricsRequest;
  if(lyricsController)lyricsController.abort();
  lyricsController=new AbortController();
  $('lyrics-text').textContent='Loading lyrics…';
  try{
    const response=await fetch(songURL(track.lyrics),{signal:lyricsController.signal});
    if(!response.ok)throw Error('Lyrics could not be loaded.');
    const text=await response.text();if(token!==lyricsRequest)return;
    track.lyricsText=text;$('lyrics-text').textContent=text;
  }catch(e){if(token===lyricsRequest&&e.name!=='AbortError')$('lyrics-text').textContent='Lyrics could not be loaded.'}
};
const time=n=>Number.isFinite(n)&&n>=0?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function mix(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rebuild(){const rest=tracks.map((_,i)=>i).filter(i=>i!==current);order=shuffled?[current,...mix(rest)]:tracks.map((_,i)=>i);position=order.indexOf(current)}
function syncPlayButton(){const paused=audio.paused||audio.ended; $('play').textContent=paused?'▶':'Ⅱ';$('play').setAttribute('aria-label',paused?'Play':'Pause')}
function render(){
  $('tracks').replaceChildren();
  tracks.forEach((t,i)=>{
    const row=document.createElement('div');row.className='track'+(i===current?' selected':'');
    const song=document.createElement('button');song.className='song';song.setAttribute('aria-label','Play '+t.title);
    if(i===current)song.setAttribute('aria-current','true');
    const num=document.createElement('span');num.className='number';num.textContent=String(i+1).padStart(2,'0');
    const names=document.createElement('span'),title=document.createElement('strong'),sub=document.createElement('small');
    title.textContent=t.title;sub.textContent=t.artist||t.file;names.append(title,sub);song.append(num,names);
    song.onclick=()=>{select(i);rebuild();play()};row.append(song);$('tracks').append(row);
  });
}

const MAX_TAG=8*1024*1024;
const integer=(a,p,n)=>{let v=0;for(let i=0;i<n;i++)v=v*256+a[p+i];return v};
const syncsafe=(a,p)=>{if(p+4>a.length||a.slice(p,p+4).some(v=>v&128))return -1;return a[p]*2097152+a[p+1]*16384+a[p+2]*128+a[p+3]};
function tagLength(header){
  if(header.length<10||String.fromCharCode(...header.slice(0,3))!=='ID3'||![2,3,4].includes(header[3]))return 0;
  const length=syncsafe(header,6);return length>0&&length<=MAX_TAG?length:0;
}
function deunsync(data){const out=[];for(let p=0;p<data.length;p++){out.push(data[p]);if(data[p]===255&&data[p+1]===0)p++}return new Uint8Array(out)}
function pictureBlob(frame,oldFormat){
  if(frame.length<6)return null;
  const encoding=frame[0];if(encoding>3)return null;
  let p=1,mime;
  if(oldFormat){const type=String.fromCharCode(...frame.slice(p,p+3)).toUpperCase();mime={JPG:'image/jpeg',PNG:'image/png',GIF:'image/gif'}[type];p+=3}
  else{const end=frame.indexOf(0,p);if(end<0)return null;mime=new TextDecoder().decode(frame.slice(p,end)).toLowerCase();p=end+1}
  if(!['image/jpeg','image/jpg','image/png','image/webp','image/gif'].includes(mime)||p>=frame.length)return null;
  const pictureType=frame[p++];
  if(encoding===1||encoding===2){while(p+1<frame.length&&(frame[p]!==0||frame[p+1]!==0))p+=2;if(p+1>=frame.length)return null;p+=2}
  else{const end=frame.indexOf(0,p);if(end<0)return null;p=end+1}
  if(p>=frame.length)return null;
  return {blob:new Blob([frame.slice(p)],{type:mime==='image/jpg'?'image/jpeg':mime}),front:pictureType===3};
}
function parseCover(header,body){
  const length=tagLength(header);if(!length||body.length<length)return null;
  const version=header[3];let data=body.slice(0,length),offset=0,first=null;
  if(version===2&&(header[5]&0x40))return null; // Compressed ID3v2.2 is not supported.
  if(version<4&&(header[5]&0x80))data=deunsync(data);
  if(version>=3&&(header[5]&0x40)){
    if(data.length<4)return null;
    offset=version===4?syncsafe(data,0):integer(data,0,4)+4;
    if(offset<4||offset>data.length)return null;
  }
  const idLength=version===2?3:4,headerLength=version===2?6:10;
  while(offset+headerLength<=data.length){
    const id=String.fromCharCode(...data.slice(offset,offset+idLength));if(!/^[A-Z0-9]+$/.test(id))break;
    const size=version===4?syncsafe(data,offset+4):integer(data,offset+idLength,version===2?3:4);
    const start=offset+headerLength,end=start+size;if(size<=0||end>data.length)break;
    if(id==='APIC'||(version===2&&id==='PIC')){
      let frame=data.slice(start,end),flags=version===2?0:data[offset+9],skip=false;
      if(version===3){skip=!!(flags&0xC0);if(flags&0x20)frame=frame.slice(1)}
      if(version===4){
        skip=!!(flags&0x0C);
        if((flags&2)||(header[5]&0x80))frame=deunsync(frame);
        if(flags&0x40)frame=frame.slice(1);if(flags&1)frame=frame.slice(4);
      }
      if(!skip){const pic=pictureBlob(frame,version===2);if(pic){if(pic.front)return pic.blob;if(!first)first=pic.blob}}
    }
    offset=end;
  }
  return first;
}
// Read only the required prefix, even when a host ignores the Range header.
// Cancelling the reader prevents an artwork lookup from downloading an entire song.
async function readPrefix(response,count,detectTag=false){
  if(!response.ok)throw Error('Artwork request failed');
  const reader=response.body.getReader();const chunks=[];let size=0,target=count;
  try{
    while(size<target){
      const {value,done}=await reader.read();if(done)break;
      const needed=Math.min(value.length,MAX_TAG+10-size);if(needed<=0)break;
      chunks.push(value.slice(0,needed));size+=needed;
      if(detectTag&&size>=10){
        const first=new Uint8Array(10);let at=0;
        for(const chunk of chunks){const take=chunk.slice(0,10-at);first.set(take,at);at+=take.length;if(at===10)break}
        const length=tagLength(first);if(!length)return null;target=10+length;detectTag=false;
      }
    }
  }finally{try{await reader.cancel()}catch(_){}}
  if(size<target)return null;
  const out=new Uint8Array(target);let p=0;
  for(const chunk of chunks){const take=chunk.slice(0,target-p);out.set(take,p);p+=take.length;if(p===target)break}
  return out;
}
async function embeddedMp3Cover(url,signal){
  const response=await fetch(url,{headers:{Range:'bytes=0-9'},signal});
  if(response.status===200){const tag=await readPrefix(response,10,true);return tag?parseCover(tag.slice(0,10),tag.slice(10)):null}
  if(response.status!==206)throw Error('Artwork request failed');
  const header=await readPrefix(response,10);if(!header)return null;
  const size=tagLength(header);if(!size)return null;
  const bodyResponse=await fetch(url,{headers:{Range:'bytes=10-'+(9+size)},signal});
  const prefix=await readPrefix(bodyResponse,bodyResponse.status===200?10+size:size);
  return prefix?parseCover(header,bodyResponse.status===200?prefix.slice(10):prefix):null;
}

let artworkRequest=0,artworkController=null,coverURL=null,artworkBytes=0;
const artworkCache=new Map(),MAX_ART_CACHE=16*1024*1024;
function cacheArtwork(url,blob){
  artworkCache.set(url,blob);artworkBytes+=blob?blob.size:0;
  while(artworkCache.size>24||artworkBytes>MAX_ART_CACHE){const [key,value]=artworkCache.entries().next().value;artworkCache.delete(key);artworkBytes-=value?value.size:0}
}
function releaseCover(){if(coverURL){URL.revokeObjectURL(coverURL);coverURL=null}}
async function loadArtwork(track,url){
  const token=++artworkRequest;
  if(artworkController)artworkController.abort();
  artworkController=new AbortController();const controller=artworkController;
  const timeout=setTimeout(()=>controller.abort(),15000),cover=$('cover');
  releaseCover();cover.hidden=true;cover.onload=null;cover.onerror=null;cover.removeAttribute('src');
  const sidecar=track.artwork?songURL(track.artwork):null;
  function show(src,fallback){
    if(token!==artworkRequest)return;
    cover.onload=()=>{if(token===artworkRequest)cover.hidden=false};
    cover.onerror=()=>{if(token!==artworkRequest)return;releaseCover();cover.hidden=true;if(fallback)show(fallback,null)};
    cover.alt='Album artwork for '+track.title;cover.src=src;
  }
  try{
    let blob=null;
    if(/\.mp3$/i.test(track.file)){
      if(artworkCache.has(url))blob=artworkCache.get(url);
      else{blob=await embeddedMp3Cover(url,controller.signal);if(!controller.signal.aborted)cacheArtwork(url,blob)}
    }
    if(token!==artworkRequest)return;
    if(blob){coverURL=URL.createObjectURL(blob);show(coverURL,sidecar)}else if(sidecar)show(sidecar,null);
  }catch(_){if(token===artworkRequest&&sidecar)show(sidecar,null)}
  finally{clearTimeout(timeout)}
}
function select(i){
  closeLyrics();
  request++;current=i;audio.pause();stopVisualizer();
  waveHistory.forEach(values=>values.length=0);lastWaveSample=0;
  $('lyrics-toggle').hidden=!tracks[i].lyrics;
  if(tracks[i].lyrics&&desktopMedia.matches) $('lyrics-toggle').click();
  const url=songURL(tracks[i].file);audio.src=url;audio.load();syncPlayButton();
  loadArtwork(tracks[i],url);
  $('title').textContent=tracks[i].title;
  $('meta').textContent=[tracks[i].artist,tracks[i].info].filter(Boolean).join(' · ')||tracks[i].file;
  $('status').textContent='';$('seek').value=0;$('seek').disabled=true;
  $('elapsed').textContent='0:00';$('duration').textContent='0:00';render();
}
async function play(){
  const token=++request;
  setupVisualizer();
  if(audioContext&&audioContext.state==='suspended')audioContext.resume().catch(()=>{});
  try{await audio.play();if(token===request){$('status').textContent='';syncPlayButton()}}
  catch(e){if(token===request&&e.name!=='AbortError')$('status').textContent='Playback could not start. Press play again, or try another track.'}
}
function advance(delta,automatic=false,startPlayback=true){
  if(!tracks.length)return;
  if(automatic&&repeat===2){audio.currentTime=0;play();return}
  let p=position+delta;
  if(p>=order.length||p<0){
    if(automatic&&repeat===0){syncPlayButton();$('status').textContent='End of playlist.';return}
    p=(p+order.length)%order.length;
    if(automatic&&shuffled&&order.length>1){const last=current;order=mix(order);if(order[0]===last)[order[0],order[1]]=[order[1],order[0]]}
  }
  position=p;select(order[position]);if(startPlayback)play();
}
$('play').onclick=()=>{if(current<0)return;if(audio.paused)play();else{request++;audio.pause();syncPlayButton()}};
$('previous').onclick=()=>advance(-1);
$('next').onclick=()=>advance(1);
$('shuffle').onclick=()=>{shuffled=!shuffled;$('shuffle').classList.toggle('on',shuffled);$('shuffle').setAttribute('aria-pressed',String(shuffled));rebuild()};
$('repeat').onclick=()=>{repeat=(repeat+1)%3;const label=['off','playlist','one track'][repeat];$('repeat').classList.toggle('on',!!repeat);$('repeat').textContent=repeat===2?'↻ 1':'↻';$('repeat').title='Repeat: '+label;$('repeat').setAttribute('aria-label','Repeat: '+label);$('status').textContent='Repeat: '+label};
audio.onplay=()=>{syncPlayButton();startVisualizer()};
audio.onpause=audio.onemptied=()=>{syncPlayButton();stopVisualizer()};
audio.onended=()=>{syncPlayButton();stopVisualizer();advance(1,true)};
audio.onerror=()=>{syncPlayButton();stopVisualizer();$('status').textContent='This track could not be loaded. Check the filename and audio format, or choose another track.'};
audio.onloadedmetadata=audio.ondurationchange=()=>{$('duration').textContent=time(audio.duration);$('seek').disabled=!(Number.isFinite(audio.duration)&&audio.duration>0)};
audio.ontimeupdate=()=>{$('elapsed').textContent=time(Number.isFinite(audio.duration)&&audio.duration>0?Math.min(audio.currentTime,audio.duration):audio.currentTime);$('seek').value=Number.isFinite(audio.duration)&&audio.duration>0?Math.min(100,audio.currentTime/audio.duration*100):0};
$('seek').oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number($('seek').value)/100*audio.duration};
$('volume').oninput=()=>{
  const level=Number($('volume').value);
  if(volumeGain)volumeGain.gain.value=level;
  else audio.volume=level;
};
async function init(){
  const controls=['play','previous','next','shuffle','repeat'];controls.forEach(id=>$(id).disabled=true);
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);
  try{
    if(CONFIG.tracks.length)tracks=CONFIG.tracks.map(t=>({...t,title:t.title||t.file.replace(/\.[^.]+$/,'')}));
    else{
      if(!owner||!repo)throw Error('Open this page on GitHub Pages, or set owner and repo in CONFIG.');
      const url='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'/contents/used-songs'+(CONFIG.branch?'?ref='+encodeURIComponent(CONFIG.branch):'');
      const response=await fetch(url,{headers:{Accept:'application/vnd.github+json'},signal:controller.signal});
      if(!response.ok)throw Error(response.status===403||response.status===429?'GitHub’s song-list limit was reached. Please try again later.':'Could not list used-songs (HTTP '+response.status+').');
      const files=await response.json();if(!Array.isArray(files))throw Error('Repository listing was not a folder.');
      const artwork=new Map(),lyrics=new Map();
      for(const f of files){if(f.type==='file'&&/\.txt$/i.test(f.name)){const stem=f.name.slice(0,-4).toLowerCase();if(!lyrics.has(stem))lyrics.set(stem,f.name)}}
      for(const f of files){const match=f.type==='file'&&f.name.match(/\.(jpe?g|png|webp)$/i);if(match){const stem=f.name.slice(0,-match[0].length).toLowerCase();if(!artwork.has(stem)||match[1].toLowerCase()==='jpg')artwork.set(stem,f.name)}}
      tracks=files.filter(f=>f.type==='file'&&/\.(mp3|m4a|aac|ogg|oga|wav|flac|opus|webm)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map(f=>{const stem=f.name.replace(/\.[^.]+$/,'');return{file:f.name,title:stem.replace(/_/g,' '),artwork:artwork.get(stem.toLowerCase())||'',lyrics:lyrics.get(stem.toLowerCase())||''}});
    }
    if(!tracks.length)throw Error('No audio files found in used-songs. Add your songs there and reload.');
    $('count').textContent=tracks.length+' tracks';document.querySelector('header p').textContent=tracks.length+' pieces. One world. Click Shuffle, Repeat, Play and stay awhile.';
    tracks=mix(tracks);select(0);rebuild();
  }catch(e){tracks=[];order=[];current=-1;$('title').textContent='The music is on its way';$('status').textContent=e.name==='AbortError'?'The song list took too long to load. Please reload and try again.':e.message}
  finally{clearTimeout(timeout);controls.forEach(id=>$(id).disabled=!tracks.length)}
}
// Move the existing controls—not copies—to the right on desktop.
const desktopMedia=window.matchMedia('(min-width:681px)');
const controlElements=['transport','seek','play-times','status','volume-group'].map(id=>{
  const el=$(id),home=document.createComment('home-'+id);
  el.parentNode.insertBefore(home,el);
  return {el,home};
});
function arrangeControls(){
  const desktop=desktopMedia.matches,host=$('desktop-controls');
  for(const {el,home} of controlElements){
    if(desktop)host.appendChild(el);
    else home.parentNode.insertBefore(el,home.nextSibling);
  }
  // On phones, put the existing working volume slider above the transport buttons.
  if(!desktop)$('transport').prepend($('volume-group'));
}
desktopMedia.addEventListener?.('change',arrangeControls);
if(!desktopMedia.addEventListener)desktopMedia.addListener(arrangeControls);
arrangeControls();
paintVisualizer();
init();
</script></body></html>
